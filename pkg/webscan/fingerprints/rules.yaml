  match:
    # Registry v2 在 /v2/ 响应上必带该头。
    - source: header
      header: docker-distribution-api-version
      pattern: '(?i)registry'

- id: kubernetes-apiserver
  search_tags: [kubernetes]
  name: Kubernetes API Server
  category: container
  cpe: cpe:/a:kubernetes:kubernetes
  softmatch: true
  match:
    # apiserver 在手写响应上会带该 PodSecurity/admission 相关头。
    - source: header
      header: x-kubernetes-pf-flowschema-uid
    # 未授权/无路由时返回标准的 Status 对象。
    - source: body
      pattern: '(?i)"kind"\s*:\s*"Status"'

- id: haproxy
  name: HAProxy
  category: load-balancer
  cpe: cpe:/a:haproxy:haproxy
  softmatch: true
  match:
    - source: header
      header: server
      pattern: '(?i)\bhaproxy\b'
    # HAProxy 默认配置里用 SERVERID Cookie 做后端粘性。
    - source: cookies
      key: SERVERID

# ---- Web 框架 / 运行时 ----

- id: remix
  name: Remix
  category: framework
  match:
    # Remix 在首页内联脚本里直出这两个全局变量之一。
    - source: body
      pattern: '(?i)__remixContext|__remixManifest'

- id: vitepress
  name: VitePress
  category: static-site
  match:
    - source: meta
      key: generator
      pattern: '(?i)^VitePress(?: v?(?<version>[\d.]+))?'
      version: ${version}

- id: jupyter
