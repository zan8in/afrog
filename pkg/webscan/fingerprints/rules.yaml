# ============================== favicon 指纹 ==============================
#
# 默认会抓 /favicon.ico（CLI 的 -w-favicon 默认开启，关闭用 -w-favicon=false；外置规则集里
# 自己写了 favicon 规则时强制抓），因此这里的规则默认参与匹配，每个目标多一次请求。
#
# 哈希取自本仓库既有 PoC 的 favicon 指纹（shodan: http.favicon.hash / icon_hash），都是
# 产品自带图标的哈希，命中即可认定是该产品，故记为 certain。

- id: n8n
  name: n8n
  category: automation
  match:
    - source: favicon
      pattern: "^-831756631$"

- id: emqx
  name: EMQX
  category: mq
  match:
    - source: favicon
      pattern: "^-670975485$"

- id: xxl-job
