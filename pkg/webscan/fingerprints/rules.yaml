# ---- 国内常见云 WAF / 主机防护 ----
#
# 这些厂商的显性标记常被默认关闭（只留 Cookie 或拦截页特征），因此同一规则里既有
# 强判据（专属头 / Cookie 名，记为 certain），也有弱判据（泛化关键词，记为 probable）。
# match 取第一条命中，故强判据必须排在弱判据之前，避免弱判据抢先降级结论。

- id: huawei-cloud-waf
  search_tags: [huawei]
  name: Huawei Cloud WAF
  category: waf
  match:
    # HWWAFSESID / HWWAFSESTIME 是华为云 WAF 注入的会话 Cookie（官方文档确认）。
    - source: header
      header: set-cookie
      pattern: '(?i)\bHWWAFSES(?:ID|TIME)='
    - source: header
      header: server
      pattern: '(?i)\bHuaweiCloudWAF\b'
    # Server: CW 见于华为云 WAF 前置节点（社区观测，非官方文档），记为 probable。
    - source: header
      header: server
      pattern: '(?i)^\s*CW\s*$'
      confidence: probable
    - source: body
      pattern: '(?i)\bhwclouds\.com\b|\bhws_security@'
      confidence: probable

- id: safedog
  name: SafeDog
  category: waf
  match:
    - source: header
      header: set-cookie
      pattern: '(?i)\bsafedog-flow-item='
