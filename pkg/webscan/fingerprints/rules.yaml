# ================================ 语言 / 运行时 ================================

- id: php
  name: PHP
  category: language
  cpe: cpe:/a:php:php
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bPHP/(?<version>[\d.]+)'
      version: ${version}
    - source: header
      header: set-cookie
      pattern: '(?i)\bPHPSESSID='
      confidence: probable

- id: aspnet
  name: ASP.NET
  category: framework
  cpe: cpe:/a:microsoft:asp.net
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bASP\.NET\b'
    - source: header
      header: x-aspnet-version
      pattern: '(?<version>[\d.]+)'
      version: ${version}

- id: express
  name: Express
  category: framework
  cpe: cpe:/a:expressjs:express
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bExpress\b'

- id: nextjs
  name: Next.js
  category: framework
  cpe: cpe:/a:vercel:next.js
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bNext\.js\b'
    # Pages Router 把整页数据以 __NEXT_DATA__ 内联脚本直出；App Router 用 __next_f.push
    # 流式直出。两者都是服务端产物、藏在被打包哈希化的页面里，属内容型强判据。
    - source: body
      pattern: '(?i)__NEXT_DATA__'
      confidence: probable
    - source: body
      pattern: '(?i)__next_f\b'
      confidence: probable
    - source: body
      pattern: "(?i)/_next/static/"
      confidence: probable

- id: nuxtjs
  name: Nuxt.js
  category: framework
  cpe: cpe:/a:nuxt:nuxt
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bNuxt\b'
    # Nuxt 2/3 都以 __NUXT__ / __NUXT_DATA__ 内联直出首屏数据。
    - source: body
      pattern: "(?i)__NUXT__"
      confidence: probable
    - source: body
      pattern: "(?i)__NUXT_DATA__"
      confidence: probable
    - source: body
      pattern: "(?i)/_nuxt/"
      confidence: probable

# ---- 打包器 / 前端框架（内容型判据） ----
#
# 判据取自「页面内联脚本」与「打包产物内容」，而非响应头或文件名：SPA 站点首页常是空壳、
# 脚本名被哈希化（/assets/index-a1b2.js），只剩内容里还留着框架的运行时痕迹。
# 内容型判据一律记为 probable——一段压缩产物里出现某个符号不足以单独确认站点身份，
# 它们只用于扩容 requires 证据（放行），绝不参与否定跳过。

- id: vite
  name: Vite
  category: bundler
  cpe: cpe:/a:vitejs:vite
  softmatch: true
  match:
    # 开发服务器注入的客户端入口。
    - source: body
      pattern: '(?i)/@vite/client'
    # 生产构建产物里注入的运行时片段（文件名被哈希化后的唯一线索）。
    - source: body
      pattern: '(?i)__vite__mapDeps'
    - source: body
      pattern: '(?i)__vite_import_meta_url__'

- id: sveltekit
  name: SvelteKit
  category: framework
  cpe: cpe:/a:svelte:sveltekit
  softmatch: true
  match:
    # 运行时注入的全局变量名带随机后缀：__sveltekit_xxxxxxxx。
    - source: body
      pattern: '(?i)__sveltekit_[0-9a-z]+'
    # 客户端路由的属性前缀。
    - source: body
      pattern: '(?i)data-sveltekit-(?:preload|reload|noscroll|keepfocus)'
    # 构建产物固定目录。
    - source: body
      pattern: "(?i)/_app/immutable/"

- id: spring-boot
  name: Spring Boot
  category: framework
  cpe: cpe:/a:vmware:spring_boot
  match:
    - source: body
      pattern: '(?i)<title>\s*Whitelabel Error Page'
      confidence: probable

- id: laravel
  name: Laravel
  category: framework
  cpe: cpe:/a:laravel:laravel
  match:
    - source: header
      header: set-cookie
      pattern: '(?i)\blaravel_session='

- id: django
  name: Django
  category: framework
  cpe: cpe:/a:djangoproject:django
  match:
    # csrftoken 是同名 Cookie 的通用写法，可能被其它框架复用。
    - source: header
      header: set-cookie
      pattern: '(?i)\bcsrftoken='
      confidence: probable

- id: rails
  name: Ruby on Rails
  category: framework
  cpe: cpe:/a:rubyonrails:rails
  match:
    - source: header
      header: set-cookie
      pattern: '(?i)\b_rails'
      confidence: probable

# ================================ 前端库 ================================

- id: angular
  name: Angular
  category: js-library
  cpe: cpe:/a:angular:angular
  softmatch: true
  match:
    # 服务端直出的 ng-version 属性，可据此取版本（唯一的 certain 判据）。
    - source: body
      pattern: '(?i)ng-version="(?<version>[\d.]+)"'
      version: ${version}
      confidence: certain
    # 视图封装注入的属性前缀（编译后的模板与样式里随处可见）。
    - source: body
      pattern: '(?i)_ngcontent-'
    - source: body
      pattern: '(?i)_nghost-'
    # Angular Universal（SSR）直出的标记。
    - source: body
      pattern: '(?i)ng-server-context'
    # Ivy 运行时在打包产物里的标识符前缀（ɵ 是 Angular 专用字符）。
    - source: body
      pattern: '(?i)ɵɵdefineComponent'

- id: react
  name: React
  category: js-library
  cpe: cpe:/a:facebook:react
  softmatch: true
  match:
    # 文件名带版本：react-18.2.0.min.js / react@18.2.0 / react-dom.18.2.0.js
    # 版本类判据必须排在「存在性判据」之前——matchRule 取第一条命中的 match。
    - source: body
      pattern: '(?i)react(?:-dom|-with-addons)?[-.@]v?(?<version>\d+(?:\.\d+){1,3})(?:\.min)?\.js'
      version: ${version}
    # 路径段带版本：/react/16.13.1/umd/react.production.min.js（版本独占一段，不是文件名前缀）
    - source: body
      pattern: '(?i)react(?:-dom|-with-addons)?/(?<version>\d+(?:\.\d+){1,3})/'
      version: ${version}
    # 查询串带版本：react.production.min.js?v=18.2.0（兼容 CDN 追加参数 ?a=1&v=18.2.0）
    - source: body
      pattern: '(?i)react(?:-dom)?(?:\.production|\.development)?(?:\.min)?\.js\?(?:[^"''\s]*[?&])?v=(?<version>\d+(?:\.\d+){1,3})'
      version: ${version}
    # 内联脚本横幅注释：/*! React v18.2.0 */
    - source: body
      pattern: '(?i)react(?:-dom)?\s+v?(?<version>\d+(?:\.\d+){1,3})'
      version: ${version}
    - source: body
      pattern: "(?i)data-reactroot"
    # 打包后的 React DOM 生产构建里，错误信息固定以该前缀开头（文件名被哈希化时的判据）。
    - source: body
      pattern: '(?i)Minified React error #'
    # React 运行时探测的开发者工具钩子名（dev/prod 构建里都出现）。
    - source: body
      pattern: '(?i)__REACT_DEVTOOLS_GLOBAL_HOOK__'
    # 兜底：只要引了 react 资源即判定（无版本）
    - source: body
      pattern: '(?i)react(?:-dom|-with-addons)?(?:\.production|\.development)?(?:\.min)?\.js'

- id: vue
  name: Vue.js
  category: js-library
  cpe: cpe:/a:vuejs:vue.js
  softmatch: true
  match:
    # 文件名带版本：vue-3.4.21.min.js / vue@3.4.21 / vue.global.prod.3.4.21.js
    - source: body
      pattern: '(?i)vue(?:\.runtime|\.global|\.prod|\.esm-browser|\.esm-bundler|\.esm|\.dev)*[-.@]v?(?<version>\d+(?:\.\d+){1,3})(?:\.min)?\.js'
      version: ${version}
    # 路径段带版本：/vue/3.4.21/dist/vue.global.prod.js
    - source: body
      pattern: '(?i)vue/(?<version>\d+(?:\.\d+){1,3})/'
      version: ${version}
    # 查询串带版本：vue.min.js?v=3.4.21（Vue 的构建产物通常不带版本号，版本多在查询串里）
    - source: body
      pattern: '(?i)vue(?:\.runtime|\.global|\.prod|\.esm-browser|\.esm-bundler|\.esm|\.dev)*(?:\.min)?\.js\?(?:[^"''\s]*[?&])?v=(?<version>\d+(?:\.\d+){1,3})'
      version: ${version}
    # 内联脚本横幅注释：/*! Vue.js v3.4.21 */
    - source: body
      pattern: '(?i)vue(?:\.js)?\s+v?(?<version>\d+(?:\.\d+){1,3})'
      version: ${version}
    # 兜底：只要引了 vue 资源即判定（无版本）。构建产物名带 .global/.prod 等后缀，需一并放行。
    - source: body
      pattern: '(?i)vue(?:\.runtime|\.global|\.prod|\.esm-browser|\.esm-bundler|\.esm|\.min|\.dev)*\.js'
    - source: body
      pattern: "(?i)data-v-[0-9a-f]{8}"

