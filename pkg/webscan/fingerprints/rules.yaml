- id: seeyon
  name: 致远 OA
  category: oa
  match:
    - source: favicon
      pattern: "^-187813927$"
    # 部署信息接口的响应头里带 SY8044 标识（Poc: seeyon-detect.yaml）。
    - source: header
      header: server
      pattern: '(?i)\bSY8044\b'
    # 登录页出现的产品标识；单看偏泛，记 probable。
    - source: body
      pattern: '(?i)seeyonProductId'
      confidence: probable
    - source: body
      pattern: '(?i)/seeyon/common/'
      confidence: probable
    # 致远 A8 独立部署路径（Poc: seeyon-yyoa-detect.yaml）。
    - source: body
      pattern: '(?i)/yyoa/seeyonoa/common'
