# ==================== 公开指纹库差集补充（FingerprintHub v4） ====================
#
# 下列规则全部来自 0x727/FingerprintHub（MIT 许可）的 web_fingerprint_v4 社区判据，并与 afrog
# 现有规则集（人工精选 rules.yaml + Wappalyzer 社区库）做过双向差集，均为 afrog 此前不具备的
# 技术。判据只取页面级 / 响应级标识（标题、厂商专属长字面量、favicon mmh3、专属响应头），
# 不做主动路径探测；厂商专属标识记 certain，仅凭通用路径片段或社区弱判据的记 probable。
#
# 注意：favicon 判据必须是 mmh3 有符号十进制（Shodan 口径）。社区库里以 32 位 md5 十六进制
# 给出的 favicon 判据无法用于本引擎，已在下文改用其它页面级判据。

# ---- 国产 OA / ERP / 政企应用 ----

- id: weaver-ecology
