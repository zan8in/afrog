      pattern: '(?i)<meta[^>]+name=["'']generator["''][^>]+content=["'']WordPress\s*(?<version>[\d.]+)'
      version: ${version}
      confidence: certain
    - source: body
      pattern: "(?i)/wp-content/"
      confidence: probable
    - source: body
      pattern: "(?i)/wp-includes/"
      confidence: probable

- id: drupal
