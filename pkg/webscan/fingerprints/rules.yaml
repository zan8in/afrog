# ================================ WAF / CDN 前置层 ================================
#
# 这一组回答的是「站点前面挡了什么」，而不是「站点自己用什么」：引擎会把 category 为
# waf/cdn 的命中单独外露成 WAF 字段，不再混进技术栈摘要，避免同一层信息被说两遍。
# 特征一律取各家专属的响应头或 Cookie 名，不用泛化关键词，以免误报。
# 只靠 Cookie 名或通用头判断的规则标为 softmatch（记为 probable）。

- id: aws-cloudfront
  name: AWS CloudFront
  category: cdn
  match:
    - source: header
      header: x-amz-cf-id
      pattern: '\S'

- id: aws-waf
  name: AWS WAF
  category: waf
  match:
    - source: header
      header: x-amzn-waf-action
      pattern: '\S'

- id: azure-front-door
  search_tags: [azure]
  name: Azure Front Door
  category: cdn
  match:
    - source: header
      header: x-azure-ref
      pattern: '\S'

- id: sucuri
  name: Sucuri
  category: waf
  match:
    - source: header
      header: x-sucuri-id
      pattern: '\S'
    - source: header
      header: server
      pattern: '(?i)\bsucuri\b'

- id: imperva-incapsula
  name: Imperva Incapsula
