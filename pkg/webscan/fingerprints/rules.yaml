# ================================ 反向代理 / CDN ================================

- id: cloudflare
  name: Cloudflare
  category: cdn
  match:
    - source: header
      header: server
      pattern: '(?i)\bcloudflare\b'
    - source: header
      header: cf-ray
      pattern: '\S'

- id: akamai
  name: Akamai
  category: cdn
  match:
    - source: header
      header: server
      pattern: '(?i)\bAkamaiGHost\b'

- id: varnish
  name: Varnish
  category: cache
  match:
    - source: header
      header: via
      pattern: '(?i)\bvarnish\b'
    - source: header
      header: x-varnish
      pattern: '\d'

- id: awselb
  name: AWS Elastic Load Balancer
  category: load-balancer
  match:
    - source: header
      header: server
      pattern: '(?i)\bawselb(?:/(?<version>[\d.]+))?'
      version: ${version}

# ================================ 语言 / 运行时 ================================

- id: php
  name: PHP
  category: language
  cpe: cpe:/a:php:php
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bPHP/(?<version>[\d.]+)'
      version: ${version}
    - source: header
      header: set-cookie
      pattern: '(?i)\bPHPSESSID='
      confidence: probable

- id: aspnet
  name: ASP.NET
  category: framework
  cpe: cpe:/a:microsoft:asp.net
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bASP\.NET\b'
    - source: header
      header: x-aspnet-version
      pattern: '(?<version>[\d.]+)'
      version: ${version}

- id: express
  name: Express
  category: framework
  cpe: cpe:/a:expressjs:express
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bExpress\b'

- id: nextjs
  name: Next.js
  category: framework
  cpe: cpe:/a:vercel:next.js
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bNext\.js\b'
    - source: body
      pattern: "(?i)/_next/static/"
      confidence: probable

- id: nuxtjs
  name: Nuxt.js
  category: framework
  cpe: cpe:/a:nuxt:nuxt
  match:
    - source: header
      header: x-powered-by
      pattern: '(?i)\bNuxt\b'
    - source: body
      pattern: "(?i)__NUXT__"
      confidence: probable

- id: spring-boot
  name: Spring Boot
  category: framework
  cpe: cpe:/a:vmware:spring_boot
  match:
    - source: body
      pattern: '(?i)<title>\s*Whitelabel Error Page'
      confidence: probable

- id: laravel
  name: Laravel
  category: framework
  cpe: cpe:/a:laravel:laravel
  match:
    - source: header
      header: set-cookie
      pattern: '(?i)\blaravel_session='

- id: django
  name: Django
  category: framework
  cpe: cpe:/a:djangoproject:django
  match:
    - source: header
      header: set-cookie
      pattern: '(?i)\bcsrftoken='

- id: rails
  name: Ruby on Rails
  category: framework
  cpe: cpe:/a:rubyonrails:rails
  match:
    - source: header
      header: set-cookie
      pattern: '(?i)\b_rails'
      confidence: probable

# ================================ 前端库 ================================

- id: angular
  name: Angular
  category: js-library
  cpe: cpe:/a:angular:angular
  softmatch: true
  match:
    - source: body
      pattern: '(?i)ng-version="(?<version>[\d.]+)"'
      version: ${version}
      confidence: certain

- id: react
  name: React
  category: js-library
  cpe: cpe:/a:facebook:react
  softmatch: true
  match:
    - source: body
      pattern: "(?i)data-reactroot"
    - source: body
      pattern: '(?i)react(?:-dom)?[.@-](?<version>[\d.]+)(?:\.min)?\.js'
      version: ${version}

- id: vue
  name: Vue.js
  category: js-library
  cpe: cpe:/a:vuejs:vue.js
  softmatch: true
  match:
    - source: body
      pattern: '(?i)vue(?:\.runtime)?(?:\.min)?\.js'
    - source: body
      pattern: "(?i)data-v-[0-9a-f]{8}"

- id: jquery
  name: jQuery
  category: js-library
  cpe: cpe:/a:jquery:jquery
  softmatch: true
  match:
    - source: body
      pattern: '(?i)jquery[.-](?<version>[\d.]+)(?:\.min)?\.js'
      version: ${version}

- id: bootstrap
  name: Bootstrap
  category: js-library
  cpe: cpe:/a:getbootstrap:bootstrap
  softmatch: true
  match:
    - source: body
      pattern: '(?i)bootstrap(?:\.min)?\.(?:css|js)(?:\?v=(?<version>[\d.]+))?'
      version: ${version}

