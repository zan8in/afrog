# ============================== favicon 指纹 ==============================
#
# 只有把 /favicon.ico 抓下来（CLI 加 -w-favicon，或外置规则集里自己写了 favicon 规则）才会
# 参与匹配，因此这里的规则默认不产生任何额外请求。
#
# 哈希取自本仓库既有 PoC 的 favicon 指纹（shodan: http.favicon.hash / icon_hash），都是
# 产品自带图标的哈希，命中即可认定是该产品，故记为 certain。

