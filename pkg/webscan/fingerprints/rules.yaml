# ---- 社区库未覆盖的前端库 ----
#
# 下面这几条在 Wappalyzer 社区库里查无对应规则，属纯缺口，只能手工维护。
# 判据优先取「文件名 / 资源路径」这类强特征，避免用过于泛化的 class 名误伤；
# 版本类判据一律排在存在性判据之前（matchRule 取第一条命中的 match）。

- id: preact
  name: Preact
  category: js-library
  cpe: cpe:/a:preactjs:preact
  softmatch: true
  match:
    # 文件名带版本：preact-10.19.2.min.js / preact@10.19.2.mjs
    - source: body
      pattern: '(?i)preact[-.@]v?(?<version>\d+(?:\.\d+){1,3})(?:\.min)?\.(?:js|mjs)'
      version: ${version}
    # 路径段带版本：/preact/10.19.2/dist/preact.min.js
    - source: body
      pattern: '(?i)preact/(?<version>\d+(?:\.\d+){1,3})/'
      version: ${version}
    # 查询串带版本：preact.min.js?v=10.19.2
    - source: body
      pattern: '(?i)preact(?:[-.@]\d+(?:\.\d+){1,3})?(?:\.min)?\.(?:js|mjs)\?(?:[^"''\s]*[?&])?v=(?<version>\d+(?:\.\d+){1,3})'
      version: ${version}
    # 横幅注释：/*! Preact v10.19.2 */
    - source: body
      pattern: '(?i)\bpreact\b\s+v?(?<version>\d+(?:\.\d+){1,3})'
      version: ${version}
    # 兜底：引了 preact（含 preact-compat / preact-hooks）资源即判定（无版本）
    - source: body
      pattern: '(?i)preact(?:-compat|-hooks)?[\w.@/-]*\.(?:js|mjs)'

- id: knockout
  name: Knockout
  category: js-library
  cpe: cpe:/a:knockoutjs:knockout
  softmatch: true
  match:
    # 文件名带版本：knockout-3.5.1.js / knockout@3.5.1.min.js
    - source: body
      pattern: '(?i)knockout[-.@]v?(?<version>\d+(?:\.\d+){1,3})(?:\.debug|\.min)?\.js'
      version: ${version}
    # 路径段带版本：/knockout/3.5.1/knockout-min.js
    - source: body
      pattern: '(?i)knockout/(?<version>\d+(?:\.\d+){1,3})/'
      version: ${version}
    # 横幅注释：/*! Knockout JavaScript library v3.5.1 */
    - source: body
      pattern: '(?i)knockout javascript library v?(?<version>\d+(?:\.\d+){1,3})'
      version: ${version}
    # 兜底：引了 knockout 资源即判定（无版本）
    - source: body
      pattern: '(?i)knockout(?:-latest|\.min|-debug)?[\w.@/-]*\.js'
    # 专属绑定入口（弱判据）
    - source: body
      pattern: '(?i)\bko\.applyBindings\s*\('
      confidence: probable

