  category: notebook
  cpe: cpe:/a:jupyter:notebook
  match:
    - source: body
      pattern: '(?i)\bJupyter(?:Lab| Notebook|Hub)\b'

# ==================== 国内应用 / OA / ERP（社区库缺失） ====================
#
# 用友、金蝶、蓝凌、深信服等国内厂商在 Wappalyzer 社区库里查无对应规则。判据全部取自
# 仓库内自带 PoC 的真实字面量（登录页固定片段、产品标识、厂商专属路径），未臆造。强度
# 仍按全文件原则：厂商专属的标题/标识/关键词记 certain，仅凭路径片段的记 probable。

# ---- 用友 ----

- id: yonyou-iuap
  name: 用友 iuap
  category: erp
  match:
    # iuap/yonBIP 工作台登录页的固定片段（Poc: yonyou-yonbip-detect.yaml）。
    - source: body
      pattern: "pageTitle = '欢迎登录';"

- id: yonyou-mobsm
  name: 用友移动系统管理
  category: erp
  match:
    # 登录页内联脚本里的固定路径（Poc: yonyou-mobsm-detect.yaml）。
    - source: body
      pattern: '"/mobsm/html/index.jsp";'

- id: yonyou-u8crm
  name: 用友 U8 CRM
  category: erp
  match:
    - source: body
      pattern: '(?i)用友U8CRM'

- id: yonyou-grp-u8
  name: 用友 GRP-U8
  category: erp
  softmatch: true
  match:
    # GRP-U8 门户资源路径，单独出现仅作 probable。
    - source: body
      pattern: '(?i)R9iPortal/'

- id: yonyou-nc
  name: 用友 NC
  category: erp
