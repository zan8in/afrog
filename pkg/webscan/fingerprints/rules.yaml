# ---- 页面元信息（社区库未覆盖） ----
#
# Open Graph 与 PWA 在 Wappalyzer 社区库里查无对应规则，但判据就在首页 HTML 里、且是
# 确定性的：og:* 的 <meta>、<link rel="manifest">。可信度按 probable 计——它们是页面
# 约定标记，不足以单独确认站点身份（只用于扩容 requires 证据），故走 softmatch。

- id: open-graph
  name: Open Graph
  category: miscellaneous
  softmatch: true
  match:
    - source: meta
      key: og:title
    - source: meta
      key: og:type
    - source: meta
      key: og:image
    - source: meta
      key: og:url

- id: pwa
  name: PWA
  category: miscellaneous
  softmatch: true
  match:
    # 声明了 Web App Manifest，是 PWA 的确定性标记。
    - source: body
      pattern: '(?i)<link[^>]+rel=["'']manifest["'']'

# ======================== 覆盖面补齐（社区库缺失） ========================
#
# 下面这些技术在 Wappalyzer 社区库里查无对应规则（或只有极弱判据），但判据就在
# 服务端可见的响应头 / 正文 / 标题里。判据强度的处理原则与全文件一致：厂商专属的
# 头/Cookie/路径/标题记 certain，仅凭泛化关键词或共享件的记 probable（软命中）。

