# afrog Web 指纹规则。
#
# 一条规则 = 「在 HTTP 响应的哪部分素材上，用什么正则、能提取出哪些字段」。
#
# 顺序即优先级（specific → generic）：同一个响应上多条规则同时命中时，结果按可信度
# 排序；可信度相同时取文件中靠前的。因此新增的 specific 规则应插到更通用的规则之前。
#
# 字段：
#   id        规则标识，唯一
#   name      技术名（写入 Technology.Name），留空时取 id
#   category  分类，如 web-server / cms / framework / language / cdn / waf / js-library / panel
#   cpe       默认 CPE，可被 match 覆盖；支持 $1 / ${name} 引用捕获组
#   softmatch true 表示该规则特征偏弱，命中记为 probable 而不是 certain
#   match     规则列表，按顺序取第一个命中的
#
# match 字段：
#   source     匹配素材：header | body | title | favicon
#   header     source 为 header 时指定具体响应头；留空表示匹配整个响应头块
#   pattern    正则（.NET 语法，支持 lookahead/lookbehind 与 (?<name>...) 具名组）
#   confidence 覆盖本条 pattern 的可信度：certain | probable
#   version    版本模板，支持 $1..$9 与 ${name}
#   cpe        本条 pattern 的 CPE 模板，留空时回落到规则级 cpe
#
# title 匹配的是页面 <title> 文本；favicon 匹配的是 favicon 的 mmh3 哈希
# （有符号十进制字符串，可用公开的 favicon 指纹库查得，例如 pattern: '^-1234567890$'）。
#
# 命中后除用于展示，还会成为 PoC requires 门控的标识词（全部小写）：
#   id                        如 requires: [thinkphp]
#   name（原样小写）          如 requires: [next.js]
#   name 的空格转连字符写法   如 requires: [apache-shiro]
#   category                  如 requires: [cms]
# 因此 category 不宜写得过宽（如统一写 web），否则 requires: [web] 会放行所有站点。

