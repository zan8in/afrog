# afrog 端口先验（port prior）。
#
# 先验的作用只有一个：当被动/主动探针都没能拿到明确证据时，给出「最可能的服务」
# 作为推测（ConfidencePortOnly），并且决定哪些端口默认值得做一次 TLS 握手。
# 它永远不会覆盖探针识别出的结果。
#
# 字段：
#   port     端口号
#   service  该端口的惯例服务名（nmap-services 风格）
#   tls      true 表示该端口按惯例是 TLS 端口：跳过明文被动读取，直接做 TLS 握手
#
# 维护约定：只收录「大面积部署 + 端口惯例稳定」的条目。某个软件偶尔占用某个端口
# 不构成先验，那种情况应该由 services.yaml 里的探针规则来识别。

