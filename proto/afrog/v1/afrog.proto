// afrog 扫描能力服务协议。
//
// 这份 proto 是扫描能力服务的对外契约，
// 字段名、编号、语义一律不得私自改动。
// 重新生成代码：cd proto/afrog/v1 && go generate ./...
syntax = "proto3";

package afrog.v1;

option go_package = "github.com/zan8in/afrog/v3/proto/afrog/v1;afrogv1";

// ==================== 公开接口（第三方语言 / 未来 MCP 适配层） ====================
service AfrogScanner {
  rpc SubmitScan(SubmitScanRequest) returns (SubmitScanResponse);
  // SubmitActions 提交一批同类型的原子动作（架构稿 §4.3）。
  //
  // 与 SubmitScan 的唯一区别是「动作由谁给出」：这里动作显式列出——工具面动作
  // （probe_http / replay_evidence / brute / oob_wait）在控制面进程内执行，执行面
  // 动作（run_poc / port_scan / web_fingerprint）走 CLI 子进程。返回的 task_id
  // 与 SubmitScan 同语义：用 StreamEvents / GetStatus / GetResults / Control 一视同仁地驱动。
  rpc SubmitActions(SubmitActionsRequest) returns (SubmitActionsResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream ScanEvent);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetResults(GetResultsRequest) returns (GetResultsResponse);
  rpc Control(ControlRequest) returns (ControlResponse);
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
}

// ==================== 内部接口（节点 ↔ 控制面） ====================
service AfrogAgent {
  // 用一次性注册令牌换取长期凭据
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 建立双向流：控制面在流内下发任务/控制，agent 在同一流内回传事件
  rpc Connect(stream AgentMessage) returns (stream ConsoleMessage);
}

// ==================== Agent 工具面（观测 / 执行 / 验证） ====================
//
// 与 MCP tools/list、tools/call 同源：同一份工具注册表、同一套策略 / 预算 / 审计门控。
// 工具入参与返回值都用 JSON 编码（理由同 Evidence.native_json）：工具契约只在
// pkg/mcp 维护一份，proto 不再镜像一套 schema，避免两份真相长期漂移。
service AgentService {
  // 列出全部可用工具及其入参 JSON Schema。
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  // 调用一个工具，返回与 MCP / REST 逐字一致的 JSON 结果。
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
}

// -------------------- 扫描规格（与 CLI 参数一一对应） --------------------
message ScanSpec {
  repeated string targets = 1;

  // PoC 选择
  string poc_source = 2; // default | curated | my
  repeated string poc_ids = 3;
  string poc_file = 4;
  string search = 5;
  string severity = 6; // 例："high,critical"

  // 性能
  int32 concurrency = 10;
  int32 rate_limit = 11;
  int32 timeout_seconds = 12;
  int32 retries = 13;
  bool smart = 14;

  // 网络
  string proxy = 15;
  repeated string headers = 16;
  bool follow_redirects = 17;

  // 前置阶段
  bool port_scan = 18;
  string ports = 19;
  bool skip_host_discovery = 20;
  bool web_fingerprint = 21;
  // web_probe_timeout 是单次 Web 探测请求与证书获取的超时（秒），0 表示用引擎默认值（30s）。
  // 与 -timeout 相互独立：全局超时管 PoC 请求，它只管探测阶段。
  int32 web_probe_timeout = 26;
  // web_favicon 开启 favicon 抓取，每个目标多一次请求。
  bool web_favicon = 27;

  // OOB
  bool enable_oob = 22;
  string oob_adapter = 23;
  string oob_key = 24;
  string oob_domain = 25;

  // 任务元信息
  string task_name = 30;
  repeated string labels = 31;
  string node_selector = 32; // 标签表达式；空表示本机执行

  // 结果去向
  // no_save_db 为真时命中不写入执行节点的 result 表（CLI 对应 -no-save-db）：
  // 只在事件流里出现，漏洞报告与台账保持干净，用于测试性、不重要的扫描。
  bool no_save_db = 33;
}

// -------------------- 事件 --------------------
message ScanEvent {
  string v = 1;
  string node = 2;
  string task = 3;
  uint64 seq = 4;
  int64 ts_ms = 5;
  oneof body {
    StatusEvent status = 10;
    ProgressEvent progress = 11;
    PhaseEvent phase = 12;
    ResultEvent result = 13;
    PortEvent port = 14;
    WebProbeEvent webprobe = 15;
    LogEvent log = 16;
    DoneEvent done = 17;
    ErrorEvent error = 18;
    HostEvent host = 19;
    ScanInfoEvent scan_info = 20;
  }
}

message StatusEvent {
  string status = 1;
}
message ScanInfoEvent {
  int32 total_targets = 1;
  int32 total_pocs = 2;
  int32 total_scans = 3;
  bool oob_enabled = 4;
  string oob_status = 5;
}
message ProgressEvent {
  int32 percent = 1;
  int64 finished = 2;
  int64 total = 3;
  int32 rate = 4;
  int64 elapsed_ms = 5;
}
message PhaseEvent {
  string phase = 1;
  string status = 2;
  int64 finished = 3;
  int64 total = 4;
  int32 percent = 5;
}
message ResultEvent {
  string severity = 1;
  string poc_id = 2;
  string poc_name = 3;
  string target = 4;
  Evidence evidence = 5;
}
message PortEvent {
  string host = 1;
  int32 port = 2;
  string service = 3;
  string product = 4;
  string version = 5;
  string device = 6;
  string hostname = 7;
  string os = 8;
  string cpe = 9;
  string info = 10;
  bool tls = 11;
  // confidence 取值 port/probable/certain，表示识别证据的强弱。
  string confidence = 12;
  string banner = 13;
  map<string, string> extras = 14;
}
// WebTechnology 是一条命中的 Web 指纹。
message WebTechnology {
  string name = 1;
  string version = 2;
  string category = 3;
  string cpe = 4;
  // confidence 取值 probable/certain，与 port.confidence 同一标尺。
  string confidence = 5;
}
message WebProbeEvent {
  string url = 1;
  int32 status = 2;
  string title = 3;
  // fingerprint 是给人看的一行技术栈摘要；无指纹命中时回落到 server + powered_by。
  string fingerprint = 4;
  string server = 5;
  string powered_by = 6;
  // confidence 是所有命中里最高的可信度，未命中时为空。
  string confidence = 7;
  repeated WebTechnology technologies = 8;
  // redirects 是初始 URL 之后每一次跳转的落点，末位即最终 URL；无跳转时为空。
  repeated string redirects = 9;
  // favicon_hash 是 favicon 的 mmh3 哈希，未抓取 favicon 时为空。
  string favicon_hash = 10;
  // tls 是 https 目标的证书摘要，非 https 或握手失败时为空。
  WebTLSInfo tls = 11;
  // waf 是命中的 WAF/CDN 名称，未识别时为空。
  string waf = 12;
}
// WebTLSInfo 是 https 目标的证书摘要，只保留判断所需的最小字段。
message WebTLSInfo {
  string subject = 1;
  string issuer = 2;
  string not_after = 3;
  repeated string dns_names = 4;
}
message HostEvent {
  string host = 1;
  // proto 是存活判定依据（icmp / ping / tcp），未知时为空。
  string proto = 2;
}
message LogEvent {
  string level = 1;
  string text = 2;
}
message DoneEvent {
  string status = 1;
  Summary summary = 2;
}
message ErrorEvent {
  string code = 1;
  string message = 2;
}

message Evidence {
  repeated Exchange exchanges = 1;
  map<string, string> extractors = 2;
  // native_json 是原生证据对象（pkg/evidence.Evidence）的 JSON 编码。
  //
  // 用 JSON 而不是在 proto 里逐字段镜像：证据契约以 JSON 为准（NDJSON / REST /
  // MCP 共用同一份定义），再镜像一套 proto schema 会变成两套真相，长期必然漂移。
  // 老节点不认识该字段时会直接忽略，新节点解析失败时回退到 exchanges/extractors，
  // 因此该字段是纯增量的兼容扩展。
  string native_json = 3;
}
message Exchange {
  string request = 1;
  string response = 2;
  bool matched = 3;
}

message Summary {
  int64 executed = 1; // 实际执行任务数
  int64 found = 2;
  map<string, int64> by_severity = 3;
  int64 elapsed_ms = 4;
}

// -------------------- 公开接口消息 --------------------
message SubmitScanRequest {
  ScanSpec spec = 1;
}
message SubmitScanResponse {
  string task_id = 1;
  string node = 2;
}

// ActionSpec 是一个原子动作（架构稿 §4.3），kind 取值见 SubmitActions 的注释。
message ActionSpec {
  string kind = 1;
  string target = 2;
  // poc_id 只有 run_poc 与 brute 使用；留空表示该目标按批量共享的 PoC 选择展开。
  string poc_id = 3;
  // params_json 是工具面动作的附加参数（JSON 对象），字段与 MCP 工具入参同名同义；
  // 执行面动作忽略。空视为无参数。
  string params_json = 4;
}
message SubmitActionsRequest {
  // spec 是这批动作共享的执行选项（性能 / 网络 / OOB / 结果去向等），
  // 语义与 SubmitScan 的 spec 完全一致。
  ScanSpec spec = 1;
  // actions 必须同 kind：一个任务只跑一种动作类型，与 scantask.Batch 的约束一致。
  repeated ActionSpec actions = 2;
}
message SubmitActionsResponse {
  string task_id = 1;
  string node = 2;
}

message StreamEventsRequest {
  string task_id = 1;
  uint64 from_seq = 2;
}
message GetStatusRequest {
  string task_id = 1;
}
message GetStatusResponse {
  string status = 1;
  ProgressEvent progress = 2;
  Summary summary = 3;
  bool pausable = 4;
  string node = 5;
}
message GetResultsRequest {
  string task_id = 1;
  string severity = 2;
  int32 page = 3;
  int32 page_size = 4;
  DetailLevel detail = 5;
}
message GetResultsResponse {
  repeated ResultEvent items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
enum DetailLevel {
  SUMMARY = 0;
  FULL = 1;
}

message ControlRequest {
  string task_id = 1;
  ControlAction action = 2;
}
message ControlResponse {
  bool ok = 1;
  string message = 2;
}
enum ControlAction {
  PAUSE = 0;
  RESUME = 1;
  CANCEL = 2;
}

message ListCapabilitiesRequest {}
message ListCapabilitiesResponse {
  string version = 1;
  string protocol_version = 2;
  int32 poc_count = 3;
  bool curated = 4;
  bool pausable = 5;
  repeated string nodes = 6;
}

// -------------------- Agent 工具面消息 --------------------
message ListToolsRequest {}
message ToolSpec {
  string name = 1;
  string description = 2;
  // input_schema_json 是工具入参 JSON Schema 的 JSON 编码；无 schema 时为空。
  string input_schema_json = 3;
}
message ListToolsResponse {
  repeated ToolSpec tools = 1;
}
message InvokeRequest {
  string name = 1;
  // arguments_json 是工具入参的 JSON 编码；空视为无参数。
  string arguments_json = 2;
}
message InvokeResponse {
  // result_json 是工具返回值的 JSON 编码，与 MCP / REST 返回体逐字一致。
  string result_json = 1;
}

// -------------------- 内部接口消息 --------------------
message RegisterRequest {
  string register_token = 1; // 一次性注册令牌
  string node_name = 2;
  string version = 3;      // afrog 版本
  string protocol_version = 4;
  string hostname = 5;
  string os_arch = 6;
  repeated string labels = 7; // 节点标签，如 ["intranet-a"]
}
message RegisterResponse {
  string node_id = 1;
  string node_secret = 2; // 长期凭据，agent 侧以 0600 权限落盘
}

message AgentMessage {
  oneof body {
    Heartbeat heartbeat = 1;
    ScanEvent event = 2;
    TaskAck ack = 3;
  }
}
message ConsoleMessage {
  oneof body {
    HeartbeatAck heartbeat_ack = 1;
    AssignTask assign = 2;
    ControlRequest control = 3;
    Revoke revoke = 4;
  }
}
message Heartbeat {
  int64 ts_ms = 1;
  int32 active_tasks = 2;
}
message HeartbeatAck {
  int64 ts_ms = 1;
}
message AssignTask {
  string task_id = 1;
  ScanSpec spec = 2;
  uint64 from_seq = 3;
}
message TaskAck {
  string task_id = 1;
  uint64 last_seq = 2;
}
message Revoke {
  string reason = 1;
}
