// afrog 扫描能力服务协议。
//
// 本文件是 docs/plan/afrog-grpc-protocol.md 第 6 节 proto 草案的落地实现，
// 两者必须逐字对应：字段名、编号、语义一律不得私自改动。
// 重新生成代码：cd proto/afrog/v1 && go generate ./...
syntax = "proto3";

package afrog.v1;

option go_package = "github.com/zan8in/afrog/v3/proto/afrog/v1;afrogv1";

// ==================== 公开接口（第三方语言 / 未来 MCP 适配层） ====================
service AfrogScanner {
  rpc SubmitScan(SubmitScanRequest) returns (SubmitScanResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream ScanEvent);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetResults(GetResultsRequest) returns (GetResultsResponse);
  rpc Control(ControlRequest) returns (ControlResponse);
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
}

// ==================== 内部接口（节点 ↔ 控制面） ====================
service AfrogAgent {
  // 用一次性注册令牌换取长期凭据
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 建立双向流：控制面在流内下发任务/控制，agent 在同一流内回传事件
  rpc Connect(stream AgentMessage) returns (stream ConsoleMessage);
}

// -------------------- 扫描规格（与 CLI 参数一一对应） --------------------
message ScanSpec {
  repeated string targets = 1;

  // PoC 选择
  string poc_source = 2; // default | curated | my
  repeated string poc_ids = 3;
  string poc_file = 4;
  string search = 5;
  string severity = 6; // 例："high,critical"

  // 性能
  int32 concurrency = 10;
  int32 rate_limit = 11;
  int32 timeout_seconds = 12;
  int32 retries = 13;
  bool smart = 14;

  // 网络
  string proxy = 15;
  repeated string headers = 16;
  bool follow_redirects = 17;

  // 前置阶段
  bool port_scan = 18;
  string ports = 19;
  bool skip_host_discovery = 20;
  bool web_fingerprint = 21;
  // web_probe_timeout 是单次 Web 探测请求与证书获取的超时（秒），0 表示用引擎默认值（30s）。
  // 与 -timeout 相互独立：全局超时管 PoC 请求，它只管探测阶段。
  int32 web_probe_timeout = 26;
  // web_favicon 开启 favicon 抓取，每个目标多一次请求。
  bool web_favicon = 27;

  // OOB
  bool enable_oob = 22;
  string oob_adapter = 23;
  string oob_key = 24;
  string oob_domain = 25;

  // 任务元信息
  string task_name = 30;
  repeated string labels = 31;
  string node_selector = 32; // 标签表达式；空表示本机执行
}

// -------------------- 事件 --------------------
message ScanEvent {
  string v = 1;
  string node = 2;
  string task = 3;
  uint64 seq = 4;
  int64 ts_ms = 5;
  oneof body {
    StatusEvent status = 10;
    ProgressEvent progress = 11;
    PhaseEvent phase = 12;
    ResultEvent result = 13;
    PortEvent port = 14;
    WebProbeEvent webprobe = 15;
    LogEvent log = 16;
    DoneEvent done = 17;
    ErrorEvent error = 18;
    HostEvent host = 19;
    ScanInfoEvent scan_info = 20;
  }
}

message StatusEvent {
  string status = 1;
}
message ScanInfoEvent {
  int32 total_targets = 1;
  int32 total_pocs = 2;
  int32 total_scans = 3;
  bool oob_enabled = 4;
  string oob_status = 5;
}
message ProgressEvent {
  int32 percent = 1;
  int64 finished = 2;
  int64 total = 3;
  int32 rate = 4;
  int64 elapsed_ms = 5;
}
message PhaseEvent {
  string phase = 1;
  string status = 2;
  int64 finished = 3;
  int64 total = 4;
  int32 percent = 5;
}
message ResultEvent {
  string severity = 1;
  string poc_id = 2;
  string poc_name = 3;
  string target = 4;
  Evidence evidence = 5;
}
message PortEvent {
  string host = 1;
  int32 port = 2;
  string service = 3;
  string product = 4;
  string version = 5;
  string device = 6;
  string hostname = 7;
  string os = 8;
  string cpe = 9;
  string info = 10;
  bool tls = 11;
  // confidence 取值 port/probable/certain，表示识别证据的强弱。
  string confidence = 12;
  string banner = 13;
  map<string, string> extras = 14;
}
// WebTechnology 是一条命中的 Web 指纹。
message WebTechnology {
  string name = 1;
  string version = 2;
  string category = 3;
  string cpe = 4;
  // confidence 取值 probable/certain，与 port.confidence 同一标尺。
  string confidence = 5;
}
message WebProbeEvent {
  string url = 1;
  int32 status = 2;
  string title = 3;
  // fingerprint 是给人看的一行技术栈摘要；无指纹命中时回落到 server + powered_by。
  string fingerprint = 4;
  string server = 5;
  string powered_by = 6;
  // confidence 是所有命中里最高的可信度，未命中时为空。
  string confidence = 7;
  repeated WebTechnology technologies = 8;
  // redirects 是初始 URL 之后每一次跳转的落点，末位即最终 URL；无跳转时为空。
  repeated string redirects = 9;
  // favicon_hash 是 favicon 的 mmh3 哈希，未抓取 favicon 时为空。
  string favicon_hash = 10;
  // tls 是 https 目标的证书摘要，非 https 或握手失败时为空。
  WebTLSInfo tls = 11;
  // waf 是命中的 WAF/CDN 名称，未识别时为空。
  string waf = 12;
}
// WebTLSInfo 是 https 目标的证书摘要，只保留判断所需的最小字段。
message WebTLSInfo {
  string subject = 1;
  string issuer = 2;
  string not_after = 3;
  repeated string dns_names = 4;
}
message HostEvent {
  string host = 1;
  // proto 是存活判定依据（icmp / ping / tcp），未知时为空。
  string proto = 2;
}
message LogEvent {
  string level = 1;
  string text = 2;
}
message DoneEvent {
  string status = 1;
  Summary summary = 2;
}
message ErrorEvent {
  string code = 1;
  string message = 2;
}

message Evidence {
  repeated Exchange exchanges = 1;
  map<string, string> extractors = 2;
}
message Exchange {
  string request = 1;
  string response = 2;
  bool matched = 3;
}

message Summary {
  int64 executed = 1; // 实际执行任务数
  int64 found = 2;
  map<string, int64> by_severity = 3;
  int64 elapsed_ms = 4;
}

// -------------------- 公开接口消息 --------------------
message SubmitScanRequest {
  ScanSpec spec = 1;
}
message SubmitScanResponse {
  string task_id = 1;
  string node = 2;
}

message StreamEventsRequest {
  string task_id = 1;
  uint64 from_seq = 2;
}
message GetStatusRequest {
  string task_id = 1;
}
message GetStatusResponse {
  string status = 1;
  ProgressEvent progress = 2;
  Summary summary = 3;
  bool pausable = 4;
  string node = 5;
}
message GetResultsRequest {
  string task_id = 1;
  string severity = 2;
  int32 page = 3;
  int32 page_size = 4;
  DetailLevel detail = 5;
}
message GetResultsResponse {
  repeated ResultEvent items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
enum DetailLevel {
  SUMMARY = 0;
  FULL = 1;
}

message ControlRequest {
  string task_id = 1;
  ControlAction action = 2;
}
message ControlResponse {
  bool ok = 1;
  string message = 2;
}
enum ControlAction {
  PAUSE = 0;
  RESUME = 1;
  CANCEL = 2;
}

message ListCapabilitiesRequest {}
message ListCapabilitiesResponse {
  string version = 1;
  string protocol_version = 2;
  int32 poc_count = 3;
  bool curated = 4;
  bool pausable = 5;
  repeated string nodes = 6;
}

// -------------------- 内部接口消息 --------------------
message RegisterRequest {
  string register_token = 1; // 一次性注册令牌
  string node_name = 2;
  string version = 3;      // afrog 版本
  string protocol_version = 4;
  string hostname = 5;
  string os_arch = 6;
  repeated string labels = 7; // 节点标签，如 ["intranet-a"]
}
message RegisterResponse {
  string node_id = 1;
  string node_secret = 2; // 长期凭据，agent 侧以 0600 权限落盘
}

message AgentMessage {
  oneof body {
    Heartbeat heartbeat = 1;
    ScanEvent event = 2;
    TaskAck ack = 3;
  }
}
message ConsoleMessage {
  oneof body {
    HeartbeatAck heartbeat_ack = 1;
    AssignTask assign = 2;
    ControlRequest control = 3;
    Revoke revoke = 4;
  }
}
message Heartbeat {
  int64 ts_ms = 1;
  int32 active_tasks = 2;
}
message HeartbeatAck {
  int64 ts_ms = 1;
}
message AssignTask {
  string task_id = 1;
  ScanSpec spec = 2;
  uint64 from_seq = 3;
}
message TaskAck {
  string task_id = 1;
  uint64 last_seq = 2;
}
message Revoke {
  string reason = 1;
}
