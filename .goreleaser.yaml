version: 2

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - main: cmd/afrog/main.go
    binary: afrog
    id: afrog
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    # goos: [windows]
    # goarch: [amd64]

    flags:
      - -trimpath
      - -pgo=auto
    ldflags:
      - -s
      - -w
      # 注入官方 PoC 验签公钥（base64）。发布流水线在签名官方 PoC 后把公钥导出到
      # 环境变量 AFROG_POC_PUBKEY_B64；未设置时注入空串，等价于开发态不启用官方验签。
      - -X github.com/zan8in/afrog/v3/pkg/pocsign.officialPublicKeyB64={{ envOrDefault "AFROG_POC_PUBKEY_B64" "" }}

archives:
  - formats:
      - zip
    id: afrog
    ids: [afrog]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}'

checksum:
  algorithm: sha256
