id: ajp-protocol-detect

info:
  name: AJP Protocol Detection
  author: pussycat0x
  severity: info
  verified: true
  description: |
    shodan: port:8009 product:"Apache Tomcat"
  tags: js,network,detect,tomcat,ajp
  created: 2026/10/13

rules:
  r0:
    request:
      type: javascript
      pre-condition: |
        isPortOpen(Host,Port)
      code: |
        var net = require("afrog/net");
        var conn = net.TCPClient();
        try {
          conn.Connect(Host, Port);
          conn.Send("\x12\x34\x00\x01\x0a");
          var resp = conn.Recv(1024);
          if (resp.includes("AB\x00\x01")) {
            Export("AJP Detected");
          }
        } catch (e) {
          // 连接/读取失败按“未检测到”处理
        } finally {
          conn.Close();
        }

      args:
        Host: "{{Host}}"
        Port: 8009
    expression: response_text.contains("AJP Detected")

expression: r0()
