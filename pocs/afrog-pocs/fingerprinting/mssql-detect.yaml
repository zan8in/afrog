id: mssql-detect

info:
  name: Microsoft SQL Server - Detect
  author: zan8in
  severity: info
  verified: true
  description: |-
    Microsoft SQL Server was detected.
  tags: network,db,sqlserver,mssql,fingerprint
  created: 2026/01/09

set:
  host: request.url.host
rules:
  # r0：发送 TDS PRELOGIN 探测包，服务端在认证之前必定返回 PRELOGIN 响应：
  #   - TDS 报文头固定为 type=0x04(Tabular Result)、status=0x01；
  #   - 长度字段为 2 字节大端，PRELOGIN 响应 >= 9 字节；
  #   - 报文头之后的第一个 token 是 0x00(VERSION)；
  #   - 选项列表以 0xFF 结束。
  # 仅凭 "包含 0x04 0x01 和 0xFF" 会把很多二进制服务误判，这里用报文头 +
  # token 结构做校验。强制加密（ENCRYPT_REQ）的服务端同样会在 TLS 之前返回该响应。
  r0:
    request:
      type: tcp
      host: "{{host}}"
      steps:
        - write:
            data: "1201005e00000100000024000601002a000102002b000103002c0004040030000105003100240600550001ff04081252000001000001397c005363526ed6eae44faa28695c803ba6b8527b3c7cab692b4a96b0d698c7a15d890201000001"
            data-type: hex
        - read:
            read-size: 4096
            read-timeout: 3
            read-type: bytes
            save-as: probe0
    expression: |
      probe0.bstartsWith(b"\x04\x01") &&
      size(probe0) >= 9 &&
      substr(probe0, 2, 1) == b"\x00" &&
      substr(probe0, 8, 1) == b"\x00" &&
      probe0.bcontains(b"\xff")
expression: r0()
