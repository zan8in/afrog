id: rabbitmq-detect

info:
  name: RabbitMQ Detection
  author: pussycat0x
  severity: info
  description: |-
    RabbitMQ is an open-source message-broker software that originally implemented the Advanced Message Queuing Protocol and has since been extended with a plug-in architecture to support Streaming Text Oriented Messaging Protocol, MQ Telemetry Transport, and other protocols.
    shodan: product:"RabbitMQ"
  reference:
    - https://nmap.org/nsedoc/scripts/amqp-info.html
  tags: network,rabbitmq,oss,fingerprint
  created: 2023/08/07

set:
  host: request.url.host
rules:
  # r0：AMQP 0-9-1 协议握手。服务端在 Connection.Start 帧里返回版本、服务端属性
  #     (product/version/platform) 和 capabilities，这一步发生在认证之前，因此
  #     开启强制认证的 RabbitMQ 同样会响应。
  #     判据以帧结构为主：type=1(method)、channel=0、class-id=10、method-id=10，
  #     这样即使 product 不是 "RabbitMQ"（Qpid、Artemis 等 0-9-1 broker），或
  #     服务端裁剪了 capabilities，也仍然可以识别为 AMQP。
  #     版本不匹配时服务端会直接回协议头 "AMQP\x00\x00..."，同样接受。
  r0:
    request:
      type: tcp
      host: "{{host}}"
      steps:
        - write:
            data: "414d51500000000901"
            data-type: hex
        - read:
            read-size: 20480
            read-timeout: 3
            read-type: bytes
            save-as: probe0
    expression: |
      (probe0.bstartsWith(b"\x01\x00\x00\x00\x00\x00") &&
       probe0.bcontains(b"\x00\x0a\x00\x0a")) ||
      probe0.bstartsWith(b"AMQP\x00\x00")
    # Connection.Start 的 server-properties 是 AMQP field table：
    #   shortstr key(长度+key) + 类型 'S'(0x53) + shortstr value(长度+value)
    # product/version/platform 均为明文，可直接提取（Qpid 等 broker 同样适用）。
    extractors:
      - type: regex
        extractor:
          ext: '"\\x07product\\x53.(?P<rabbitmq>[A-Za-z0-9][A-Za-z0-9 ._+-]*)".bsubmatch(probe0)'
          rabbitmq: ext["rabbitmq"]
          ext2: '"\\x07version\\x53.(?P<rabbitmq_version>[0-9][0-9.]*)".bsubmatch(probe0)'
          rabbitmq_version: ext2["rabbitmq_version"]
          ext3: '"\\x08platform\\x53.(?P<rabbitmq_platform>[A-Za-z0-9][A-Za-z0-9 ._+/-]*)".bsubmatch(probe0)'
          rabbitmq_platform: ext3["rabbitmq_platform"]
  # r1：amqps（5671），TLS 之上再做同样的 AMQP 0-9-1 握手
  r1:
    request:
      type: ssl
      host: "{{host}}"
      steps:
        - write:
            data: "414d51500000000901"
            data-type: hex
        - read:
            read-size: 20480
            read-timeout: 3
            read-type: bytes
            save-as: probe1
    expression: |
      (probe1.bstartsWith(b"\x01\x00\x00\x00\x00\x00") &&
       probe1.bcontains(b"\x00\x0a\x00\x0a")) ||
      probe1.bstartsWith(b"AMQP\x00\x00")
    extractors:
      - type: regex
        extractor:
          ext: '"\\x07product\\x53.(?P<rabbitmq>[A-Za-z0-9][A-Za-z0-9 ._+-]*)".bsubmatch(probe1)'
          rabbitmq: ext["rabbitmq"]
          ext2: '"\\x07version\\x53.(?P<rabbitmq_version>[0-9][0-9.]*)".bsubmatch(probe1)'
          rabbitmq_version: ext2["rabbitmq_version"]
          ext3: '"\\x08platform\\x53.(?P<rabbitmq_platform>[A-Za-z0-9][A-Za-z0-9 ._+/-]*)".bsubmatch(probe1)'
          rabbitmq_platform: ext3["rabbitmq_platform"]
expression: r0() || r1()
