id: hikvision-isecure-center-detect

info:
  name: Hikvision iSecure Center Panel Detect
  author: zan8in
  severity: info
  verified: true
  description: |-
    海康威视综合安防管理平台 iSecure Center 登录页指纹，为 requires: [hikvision] 提供门控来源。
  tags: hikvision,isecure-center,isc,panel,detect,fingerprint
  created: 2026/11/01

rules:
  r0:
    request:
      method: GET
      path: /portal/
      follow_redirects: true
    expression: |
      response.status == 200 &&
      (
        response.body.bcontains(b'/portal/skin/isee/') ||
        response.body.ibcontains(b'iSecure') ||
        response.body.ibcontains(b'综合安防管理平台')
      )
  r1:
    request:
      method: GET
      path: /portal/cas/loginPage
      follow_redirects: true
    expression: |
      response.status == 200 &&
      (
        response.body.bcontains(b'/portal/skin/isee/') ||
        response.body.ibcontains(b'iSecure') ||
        response.body.ibcontains(b'综合安防管理平台')
      )
expression: r0() || r1()
