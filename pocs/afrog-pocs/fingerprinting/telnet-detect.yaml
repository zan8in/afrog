id: telnet-detect

info:
  name: Telnet Service - Detect
  author: zan8in
  severity: info
  verified: true
  description: |-
    Telnet service was detected.
  tags: network,telnet,fingerprint
  created: 2026/01/09

set:
  host: request.url.host
rules:
  r0:
    request:
      type: tcp
      host: "{{host}}"
      steps:
        - read:
            read-size: 4096
            read-timeout: 10
    expression: |
      !response.raw.bstartsWith(b"SSH-") &&
      (
        response.raw.bcontains(b"\xff\xfb") ||
        response.raw.bcontains(b"\xff\xfd") ||
        response.raw.bcontains(b"\xff\xfc") ||
        response.raw.bcontains(b"\xff\xfe") ||
        response.raw.bcontains(b"\xff\xfa") ||
        response.raw.ibcontains(b"login:") ||
        response.raw.ibcontains(b"password:") ||
        response.raw.ibcontains(b"username:")
      )

expression: r0()
