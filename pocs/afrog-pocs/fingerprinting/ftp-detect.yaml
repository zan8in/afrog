id: ftp-detect

info:
  name: FTP Service - Detect
  author: zan8in
  severity: info
  verified: true
  description: |-
    FTP 服务识别。不依赖 banner 文案，连接建立后一次性投递多条 FTP 核心命令，再把
    整段回包当作证据：既确认控制通道出现过 220 应答，又确认命令应答码出现在行首。

      - SYST  -> 215（命令被接受），或 530（要求先登录）
      - FEAT  -> 211（特性列表，多行 211-... / 211 ...）
      - USER  -> 331 / 230 / 332（用户名被接受），或 530（匿名登录被禁）
      - TYPE  -> 200（传输类型被接受）
      - PWD   -> 257（返回工作目录）
      - AUTH TLS -> 234（显式 FTPS，命令被接受）

    这样覆盖了各类服务端差异：
      - 登录前允许 SYST 的服务端（215）；
      - 登录前拒绝 SYST/HELP 的服务端（530，如 vsftpd 加固配置）；
      - 匿名登录被禁、但 USER 仍被识别的服务端（530 / 331 / 332）；
      - 只实现最小命令集、但对 TYPE/PWD 有正常响应的服务端（200 / 257）；
      - FEAT 单独可用的服务端（211）；
      - 显式 FTPS-only（明文通道上 SYST/USER 一律 530，AUTH TLS 234）；
      - 隐式 FTPS（990，TLS 握手后同样回 220 应答）。

    刻意不使用 HELP 判定：SMTP 的 HELP 同样返回 214，只看 HELP 会把 220 应答的
    SMTP 误判成 FTP。上面这些应答码在 220 应答下不会被 SMTP 正常返回（SMTP 对
    SYST/FEAT/USER/TYPE/PWD 一律回 500/501/502/504）。

    探测采用「先投递命令、后读取整段回包」的方式：
      - 即使服务端在某个命令后立即断开连接，已经到达的应答仍在回包里，不会因为
        后续写/读失败而丢掉证据；
      - 220 应答与命令应答在同一段回包里，不存在多步 read-until 造成的对齐/截断；
      - 应答码按行首匹配，多行应答（如 FEAT 的 "211-Features:"）同样命中，也不会
        把响应正文里偶然出现的数字误当成应答码；
      - AUTH TLS 单独用一条规则，避免 SMTP 把 "AUTH TLS" 当成需要先 STARTTLS 的
        AUTH 机制而返回 530，造成误报。

    r0 覆盖明文控制通道（显式 FTPS 在升级 TLS 前的控制通道同样是明文 FTP 语义）；
    r1 覆盖只放行 AUTH TLS 的服务端；r2 覆盖隐式 FTPS（应答直接出现在 TLS 会话里，
    如 990），该规则要求目标端口本身被扫描到。
  reference:
    - https://datatracker.ietf.org/doc/html/rfc959
    - https://datatracker.ietf.org/doc/html/rfc2389
    - https://datatracker.ietf.org/doc/html/rfc4217
  tags: network,ftp,fingerprint
  created: 2026/01/09

set:
  host: request.url.host
rules:
  r0:
    request:
      type: tcp
      host: "{{host}}"
      steps:
        - write:
            data: "SYST\r\nFEAT\r\nUSER anonymous\r\nTYPE I\r\nPWD\r\n"
        - read:
            read-size: 8192
            read-timeout: 3
            read-type: bytes
            save-as: probe0
    expression: '"(?m)^220\\b".bmatches(probe0) && "(?m)^(215|200|211|257|331|230|332|530)[- ]".bmatches(probe0)'
  r1:
    request:
      type: tcp
      host: "{{host}}"
      steps:
        - write:
            data: "AUTH TLS\r\n"
        - read:
            read-size: 8192
            read-timeout: 3
            read-type: bytes
            save-as: probe1
    expression: '"(?m)^220\\b".bmatches(probe1) && "(?m)^234[- ]".bmatches(probe1)'
  r2:
    request:
      type: ssl
      host: "{{host}}"
      steps:
        - write:
            data: "SYST\r\nFEAT\r\nUSER anonymous\r\nTYPE I\r\nPWD\r\nAUTH TLS\r\n"
        - read:
            read-size: 8192
            read-timeout: 3
            read-type: bytes
            save-as: probe2
    expression: '"(?m)^220\\b".bmatches(probe2) && "(?m)^(215|200|211|234|257|331|230|332|530)[- ]".bmatches(probe2)'
expression: r0() || r1() || r2()
