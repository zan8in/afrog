id: smtp-detect

info:
  name: SMTP Service - Detect
  author: zan8in
  severity: info
  verified: true
  description: |-
    SMTP 的全称是 Simple Mail Transfer Protocol（简单邮件传输协议）。
    它是专门用于发送电子邮件以及在邮件服务器之间传递邮件的协议。
    关键点：SMTP 是 “发信”协议，而 POP3/IMAP 是 “收信”协议。一个完整的邮件流程需要两者配合。
    默认端口
    SMTP 非加密端口：25
    SMTP over SSL/TLS 加密端口：465（现代邮件服务都强制使用加密端口，以保证密码和邮件的安全）
    发邮件用 SMTP（端口 587/465）
    收邮件用 POP3/IMAP（端口 995/993）
    一个完整的邮件服务 = SMTP（发） + POP3/IMAP（收）
    fofa: protocol="smtp"
  tags: network,smtp,fingerprint
  created: 2026/01/09

set:
  host: request.url.host
rules:
  # r0：先读到完整的问候语首行，再一次性投递 EHLO 和 HELO，最后读整段回包。
  #   - 问候语不要求出现 smtp/esmtp 字样：很多服务端只回 "220 hostname ESMTP"
  #     甚至 "220 hostname ready"，只要行首是 220 即可；
  #   - 部分服务端禁用 EHLO 扩展（502/504），HELO 仍会回 250；
  #   - 因此以「220 问候语 + (问候语含 smtp/esmtp 或 回包出现 250 应答行)」判定。
  #   - 采用一次 write 投递 EHLO+HELO、一次 read 取整段回包，避免 read-until
  #     截断后丢掉 HELO 的 250 应答。
  r0:
    request:
      type: tcp
      host: "{{host}}"
      steps:
        - read:
            read-size: 4096
            read-timeout: 3
            read-until: "\r\n"
            read-type: bytes
            save-as: greeting0
        - write:
            data: "EHLO afrog.local\r\nHELO afrog.local\r\n"
        - read:
            read-size: 8192
            read-timeout: 3
            read-type: bytes
            save-as: reply0
    expression: |
      "(?i)^220[- ]".bmatches(greeting0) &&
      (greeting0.ibcontains(b"smtp") || "(?m)^250[- ]".bmatches(reply0))
    # greeting 里通常含主机名与软件标识（如 `220 mail.local ESMTP Postfix`）；
    # EHLO 应答的 `250-` 行是扩展能力（SIZE/STARTTLS/AUTH 等）。
    extractors:
      - type: regex
        extractor:
          ext: '"(?i)^220[- ](?P<smtp>[^\\r\\n]+)".bsubmatch(greeting0)'
          smtp: ext["smtp"]
          ext2: '"(?im)^250-(?P<smtp_capability>[^\\r\\n]+)".bsubmatchall(reply0)'
          smtp_capabilities: ext2["smtp_capability"]
  # r1：SMTPS（465），TLS 握手后服务端先回 220，再做同样的 EHLO/HELO 探测
  r1:
    request:
      type: ssl
      host: "{{host}}"
      steps:
        - read:
            read-size: 4096
            read-timeout: 3
            read-until: "\r\n"
            read-type: bytes
            save-as: greeting1
        - write:
            data: "EHLO afrog.local\r\nHELO afrog.local\r\n"
        - read:
            read-size: 8192
            read-timeout: 3
            read-type: bytes
            save-as: reply1
    expression: |
      "(?i)^220[- ]".bmatches(greeting1) &&
      (greeting1.ibcontains(b"smtp") || "(?m)^250[- ]".bmatches(reply1))
    extractors:
      - type: regex
        extractor:
          ext: '"(?i)^220[- ](?P<smtp>[^\\r\\n]+)".bsubmatch(greeting1)'
          smtp: ext["smtp"]
          ext2: '"(?im)^250-(?P<smtp_capability>[^\\r\\n]+)".bsubmatchall(reply1)'
          smtp_capabilities: ext2["smtp_capability"]
expression: r0() || r1()
