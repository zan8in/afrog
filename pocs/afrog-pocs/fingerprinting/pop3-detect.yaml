id: pop3-detect

info:
  name: POP3 Service - Detect
  author: zan8in
  severity: info
  verified: true
  description: |-
    POP3 的全称是 Post Office Protocol version 3。
    它是一种非常经典且简单的 电子邮件接收协议，用于从邮件服务器下载邮件到本地设备。
    连接服务器：您的邮件客户端（如 Outlook、Foxmail、系统自带的邮件应用）使用 110 端口（默认，非加密） 或 995 端口（SSL/TLS 加密） 连接到 POP3 邮件服务器。
    身份验证：输入用户名和密码。
    下载邮件：服务器会将所有新邮件一次性下载到您的本地设备（电脑、手机）。
    （默认）删除服务器副本：邮件下载完成后，默认情况下，服务器上的邮件会被删除。这样做的初衷是节省服务器空间，并且所有邮件都保存在本地。
    断开连接：操作完成，连接断开。
    默认端口
    POP3 非加密端口：110
    POP3 over SSL/TLS 加密端口：995（现代邮件服务都强制使用加密端口，以保证密码和邮件的安全）
    fofa: protocol="pop3"
  tags: network,pop3,fingerprint
  created: 2026/01/09

set:
  host: request.url.host
rules:
  # r0：POP3 服务端在连接建立、认证之前必定返回一条以 +OK 开头的问候语。
  #     问候语文案差异很大（+OK Dovecot ready. / +OK POP3 server ready / +OK ready），
  #     并不一定包含 "pop3" 字样，因此以 +OK 状态行作为判据，不依赖 CAPA：
  #   - CAPA 被禁用（-ERR Capability not supported）或要求先认证时，banner 仍然有效；
  #   - +OK 是 POP3 特有的状态行，SMTP 是 220、IMAP 是 * OK，不会互相误判。
  r0:
    request:
      type: tcp
      host: "{{host}}"
      steps:
        - read:
            read-size: 4096
            read-timeout: 3
            read-until: "\r\n"
            read-type: bytes
            save-as: banner0
    expression: '"(?i)^\\+OK".bmatches(banner0)'
  # r1：POP3S（995），TLS 握手后 greeting 同样是 +OK
  r1:
    request:
      type: ssl
      host: "{{host}}"
      steps:
        - read:
            read-size: 4096
            read-timeout: 3
            read-until: "\r\n"
            read-type: bytes
            save-as: banner1
    expression: '"(?i)^\\+OK".bmatches(banner1)'
expression: r0() || r1()
