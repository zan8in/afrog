id: imap-detect

info:
  name: IMAP Service - Detect
  author: zan8in
  severity: info
  verified: true
  description: |-
    IMAP 的全称是 Internet Message Access Protocol。
    它是一种用于访问和管理电子邮件服务器上邮件的协议。
    与 POP3 不同，IMAP 允许用户在多个设备上同步查看和管理邮件，而无需下载到本地设备。
    默认端口
    IMAP 非加密端口：143
    IMAP over SSL/TLS 加密端口：993（现代绝对的标准和必选项）
    fofa: protocol="imap"
  tags: network,imap,fingerprint
  created: 2026/01/09

set:
  host: request.url.host
rules:
  # r0：先读问候语，再发送 CAPABILITY 探测。
  #   - 问候语只要求 "* OK" / "* PREAUTH"，不要求包含 imap 字样
  #     （如 "* OK Dovecot ready."）；
  #   - CAPABILITY 应答无论是否已认证都允许，返回 "* CAPABILITY IMAP4rev1 ..."；
  #   - 只要问候语成立，且问候语带 imap 或 CAPABILITY 应答成立即可识别。
  r0:
    request:
      type: tcp
      host: "{{host}}"
      steps:
        - read:
            read-size: 4096
            read-timeout: 3
            read-until: "\r\n"
            read-type: bytes
            save-as: greeting0
        - write:
            data: "a1 CAPABILITY\r\n"
        - read:
            read-size: 8192
            read-timeout: 2
            read-type: bytes
            save-as: reply0
    expression: |
      "(?i)^\\* (OK|PREAUTH)".bmatches(greeting0) &&
      (greeting0.ibcontains(b"imap") ||
       reply0.ibcontains(b"imap4") ||
       reply0.ibcontains(b"capability"))
    # CAPABILITY 应答给出服务端支持的能力集（IMAP4rev1/IDLE/STARTTLS/AUTH=...）。
    extractors:
      - type: regex
        extractor:
          ext: '"(?i)capability (?P<imap>[^\\r\\n]+)".bsubmatch(reply0)'
          imap: ext["imap"]
  # r1：IMAPS（993），TLS 之上同样读 greeting + CAPABILITY
  r1:
    request:
      type: ssl
      host: "{{host}}"
      steps:
        - read:
            read-size: 4096
            read-timeout: 3
            read-until: "\r\n"
            read-type: bytes
            save-as: greeting1
        - write:
            data: "a1 CAPABILITY\r\n"
        - read:
            read-size: 8192
            read-timeout: 2
            read-type: bytes
            save-as: reply1
    expression: |
      "(?i)^\\* (OK|PREAUTH)".bmatches(greeting1) &&
      (greeting1.ibcontains(b"imap") ||
       reply1.ibcontains(b"imap4") ||
       reply1.ibcontains(b"capability"))
    extractors:
      - type: regex
        extractor:
          ext: '"(?i)capability (?P<imap>[^\\r\\n]+)".bsubmatch(reply1)'
          imap: ext["imap"]
expression: r0() || r1()
