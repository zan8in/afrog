id: ajp-protocol-detect

info:
  name: AJP Protocol Detection
  author: pussycat0x
  severity: info
  verified: true
  description: |
    shodan: port:8009 product:"Apache Tomcat"
  tags: js,network,detect,tomcat,ajp,fingerprint
  created: 2026/10/13

rules:
  r0:
    request:
      type: javascript
      pre-condition: |
        isPortOpen(Host,Port)
      code: |
        var net = require("afrog/net");
        var c = net.TCPClient();

        c.SetTimeout(5);
        c.SetReadSize(1024);
        c.Connect(Host, Port);

        c.Send("\x12\x34\x00\x01\x0a");
        var resp = c.Recv(1024);
        c.Close();
        Export(resp);
      args:
        Host: "{{Host}}"
        Port: 8009
    expression: response_text.contains("AB\x00\x01")
expression: r0()
